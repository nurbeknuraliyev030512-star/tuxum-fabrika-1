<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EggPro - Tuxum Yetkazib Berish Tizimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f59e0b;
            --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
            min-height: 100vh;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-badge {
            background: rgba(245, 158, 11, 0.1);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 16px;
        }

        /* Navigatsiya */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 12px 10px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-btn {
            border: none;
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .nav-btn.active {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Kartochkalar */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 14px 10px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 6px;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Forma Elementlari */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--primary-gradient);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-small { width: auto; padding: 8px 16px; font-size: 0.85rem; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); box-shadow: none; }

        /* Market kartochkalari */
        .market-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            transition: 0.3s;
        }

        .market-card.has-debt {
            border-left-color: var(--danger);
        }

        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .market-name {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .market-owner {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .debt-badge {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .debt-badge.no-debt {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .action-btns {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .action-btn {
            flex: 1;
            padding: 9px;
            font-size: 0.8rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-call { background: rgba(14, 165, 233, 0.15); color: #38bdf8; }
        .btn-sms { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .btn-barter { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        /* Kalkulyator natijasi */
        .calc-result {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 14px;
            margin-top: 14px;
        }

        .calc-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

            padding-top: 10px;

            font-
